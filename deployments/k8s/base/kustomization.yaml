apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: academic-scheduler
  app.kubernetes.io/managed-by: kustomize

# Common annotations
commonAnnotations:
  app.kubernetes.io/version: "1.0.0"

# Base resources
resources:
  # Namespace
  - namespace.yaml
  
  # Secrets
  - ../secrets/database-secrets.yaml
  
  # Infrastructure
  - ../infrastructure/redis/deployment.yaml
  - ../infrastructure/redis/service.yaml
  - ../infrastructure/redis/pvc.yaml
  - ../infrastructure/postgres/statefulset.yaml
  - ../infrastructure/postgres/service.yaml
  - ../infrastructure/postgres/configmap.yaml
  - ../infrastructure/mongodb/configmap.yaml
  
  # Microservices
  - ../services/conflictmanager/deployment.yaml
  - ../services/conflictmanager/service.yaml
  - ../services/conflictmanager/configmap.yaml
  - ../services/schedulevotingmanager/deployment.yaml
  - ../services/schedulevotingmanager/service.yaml
  - ../services/schedulevotingmanager/configmap.yaml
  - ../services/usermanager/deployment.yaml
  - ../services/usermanager/service.yaml
  - ../services/usermanager/configmap.yaml
  - ../services/coursemanager/deployment.yaml
  - ../services/coursemanager/service.yaml
  - ../services/coursemanager/configmap.yaml
  - ../services/schedulemanager/deployment.yaml
  - ../services/schedulemanager/service.yaml
  - ../services/schedulemanager/configmap.yaml
  - ../services/frontend/deployment.yaml
  - ../services/frontend/service.yaml
  - ../services/frontend/configmap.yaml
  
  # Monitoring
  - ../monitoring/prometheus/configmap.yaml
  - ../monitoring/prometheus/deployment.yaml
  - ../monitoring/prometheus/service.yaml
  - ../monitoring/prometheus/rbac.yaml
  - ../monitoring/grafana/configmap.yaml
  - ../monitoring/grafana/deployment.yaml
  - ../monitoring/grafana/service.yaml
  
  # Ingress (if using)
  - ingress.yaml

# ConfigMap generator for common configuration
configMapGenerator:
  - name: app-config
    literals:
      - ENVIRONMENT=production
      - SPRING_PROFILE=prod
      - API_URL=http://api.academic-scheduler.local
      - LOG_LEVEL=INFO
      - REDIS_HOST=redis
      - REDIS_PORT=6379

# Image configurations
images:
  - name: conflictmanager
    newTag: latest
  - name: schedulevotingmanager
    newTag: latest
  - name: usermanager
    newTag: latest
  - name: coursemanager
    newTag: latest
  - name: schedulemanager
    newTag: latest
  - name: frontend
    newTag: latest