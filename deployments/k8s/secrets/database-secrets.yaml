apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app: academic-scheduler
type: Opaque
stringData:
  # MongoDB Atlas Connection String
  # Replace with your actual MongoDB connection string
  MONGODB_URI: "mongodb+srv://<username>:<password>@<cluster>.mongodb.net/<database>?retryWrites=true&w=majority"
  
  # Redis Password
  REDIS_PASSWORD: "change-me-in-production"
  
  # PostgreSQL Credentials (for SonarQube)
  POSTGRES_USER: "sonarqube"
  POSTGRES_PASSWORD: "sonarqube-password-change-me"
  
  # Grafana Admin Credentials
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: "admin-change-me"
  
  # Optional: Gemini API Key (for AI features)
  GEMINI_API_KEY: ""
  
  # JWT Secret for authentication
  JWT_SECRET: "your-jwt-secret-key-change-me"

---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  labels:
    app: mongodb
type: Opaque
stringData:
  MONGODB_USERNAME: "admin"
  MONGODB_PASSWORD: "change-me-in-production"
  MONGODB_DATABASE: "academic_scheduler"

---
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  labels:
    app: academic-scheduler
type: Opaque
stringData:
  # Add any external API keys here
  GEMINI_API_KEY: ""
  SENDGRID_API_KEY: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
