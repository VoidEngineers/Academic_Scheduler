apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'academic-scheduler'
        environment: 'production'

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Java microservices
      - job_name: 'usermanager'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['usermanager:8082']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'usermanager'

      - job_name: 'coursemanager'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['coursemanager:8081']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'coursemanager'

      - job_name: 'schedulemanager'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['schedulemanager:8083']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'schedulemanager'

      # Python microservices
      - job_name: 'conflictmanager'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['conflictmanager:5000']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'conflictmanager'

      - job_name: 'schedulevotingmanager'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['schedulevotingmanager:5000']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'schedulevotingmanager'

      # Redis
      - job_name: 'redis'
        static_configs:
          - targets: ['redis:6379']

      # Kubernetes pods with prometheus annotations
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
