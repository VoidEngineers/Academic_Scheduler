apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: academic-scheduler
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/VoidEngineers/Academic_Scheduler.git
    targetRevision: main  # Change to your branch: fix/defect-components
    path: deployments/k8s/overlays/development  # Change to staging/production as needed
  
  destination:
    server: https://kubernetes.default.svc
    namespace: academic-scheduler
  
  syncPolicy:
    automated:
      prune: true      # Automatically delete resources no longer in Git
      selfHeal: true   # Automatically sync when cluster differs from Git
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true  # Create namespace if it doesn't exist
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Health assessment
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas  # Ignore replica count differences (for HPA)
