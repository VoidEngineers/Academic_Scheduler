apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: academic-scheduler-ingress
  labels:
    app: academic-scheduler
    environment: development
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: dev.academic-scheduler.local
      http:
        paths:
          # Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5173
          
          # API endpoints
          - path: /api/conflicts
            pathType: Prefix
            backend:
              service:
                name: conflictmanager
                port:
                  number: 5000
          
          - path: /api/voting
            pathType: Prefix
            backend:
              service:
                name: schedulevotingmanager
                port:
                  number: 5000
          
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: usermanager
                port:
                  number: 8082
          
          - path: /api/courses
            pathType: Prefix
            backend:
              service:
                name: coursemanager
                port:
                  number: 8081
          
          - path: /api/schedules
            pathType: Prefix
            backend:
              service:
                name: schedulemanager
                port:
                  number: 8083
